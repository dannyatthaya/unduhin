[package]
name = "unduhin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unduhin core: queue, persistence, categories, settings, event bus."
build = "build.rs"

[lib]
name = "unduhin_core"
path = "src/lib.rs"

[dependencies]
engine = { path = "../engine" }
# Torrent backend facade over librqbit (design §3.D). `core` depends on it for
# the `TorrentEngine` it lazily constructs on the first torrent claim; it never
# sees a librqbit type.
torrent = { path = "../torrent" }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Optional: TypeScript-type export for the wire contract. Gated
# behind the `ts-rs-export` feature so normal builds don't pull it in.
ts-rs = { version = "9", optional = true }

[features]
# Enables the `#[derive(TS)]` cfg_attrs on `crate::wire` types and the
# `tests/export_wire_types.rs` test that writes the generated `.d.ts`
# files. Run with `cargo test --features ts-rs-export export_wire_types`.
ts-rs-export = ["dep:ts-rs"]
# Tests only. On macOS, seal captured headers with an in-memory key instead
# of the one kept in the login Keychain, which CI runners don't have. Other
# crates' tests enable it as a dev-dependency feature, so it never reaches a
# release build.
ephemeral-header-key = []

[target.'cfg(target_os = "windows")'.dependencies]
# DPAPI (CryptProtectData / CryptUnprotectData) for encrypting captured
# browser headers at rest, plus job objects for killing the whole yt-dlp
# process tree (see `ytdlp::ProcessTreeGuard`). Match the version the
# Tauri shell already pins.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain access for the master key that wraps captured browser headers
# at rest — the macOS counterpart to Windows DPAPI (see `crate::secret`).
security-framework = "3"
# AES-256-GCM for the wrapping itself. Already compiled as part of the
# rustls stack, so this is a direct dependency on something the build
# produces anyway rather than new supply-chain surface.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# `killpg` for reaping the yt-dlp → ffmpeg process group, the POSIX
# counterpart to the Windows job object (see `ytdlp::ProcessTreeGuard`).
# Already in the dependency graph transitively, so this adds no new
# supply-chain surface.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
